name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Job 1: Quick Code Health Checks (Lint, Format, Unit Tests)
  code-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Code Formatting
        run: npm run format:check

      - name: Run Code Linter
        run: npm run lint

      - name: Run Vitest Unit Tests
        run: npm run test:unit

  # Job 2: Browser Integration and E2E Testing
  playwright-tests:
    needs: [code-validation] # Only runs if code validation passes completely
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Build Next.js Production App
        env:
          NEXT_PUBLIC_SUPABASE_URL: 'https://supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'placeholder-anon-key'
          # If your app checks for a private service role key, add it here too:
          # SUPABASE_SERVICE_ROLE_KEY: "placeholder-service-key"
        run: npm run build

      # Starts your Next.js server in the background so it doesn't block the terminal
      - name: Start Next.js App in Background
        run: npm run start &

      # Wait up to 2 minutes for port 3000 to be completely ready in the cloud
      - name: Wait for Next.js Server to be Ready
        run: npx wait-on http://localhost:3000 --timeout 120000

      - name: Run Playwright E2E tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
